<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editor Org</title>
<style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0;padding:2rem}input,textarea{width:100%;padding:.6rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box;margin:.5rem 0}button{padding:.7rem 1.2rem;border:none;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}</style></head>
<body><h1>✏️ Editor Website Org</h1>
<label>Judul</label><input id="title">
<label>Isi</label><textarea id="body" rows="6"></textarea>
<button onclick="save()">Simpan</button><p id="msg"></p>
<script>
async function load(){const r=await fetch('/api/content');const d=await r.json();document.getElementById('title').value=d.data.title;document.getElementById('body').value=d.data.body;}
async function save(){const title=document.getElementById('title').value;const body=document.getElementById('body').value;const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body})});const d=await r.json();document.getElementById('msg').textContent=d.ok?'Tersimpan!':'Gagal.';}
load();
</script></body></html>

<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Editor Website Org</title>
<style>body{font-family:system-ui;margin:0;background:#0f172a;color:#e2e8f0;display:grid;grid-template-columns:1fr 1fr;height:100vh}header{grid-column:1/-1;background:#1e293b;padding:1rem 2rem}textarea{width:100%;height:100%;background:#020617;color:#e2e8f0;border:none;padding:1rem;font-family:monospace;box-sizing:border-box}iframe{width:100%;height:100%;border:none;background:#fff}</style></head>
<body><header><h1>✏️ Editor Website Org</h1></header>
<textarea id="code"><h1>Halo Organisasi</h1><p>Edit di sini...</p></textarea>
<iframe id="preview"></iframe>
<script>
const t=document.getElementById('code'),p=document.getElementById('preview');
function upd(){p.srcdoc=t.value;}
t.addEventListener('input',upd);upd();
</script></body></html>
